name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # /run/containers already exists on the runner, owned by root and not
      # traversable by the runner user, so dockerTools.pullImage's skopeo
      # call fails reading/writing its auth.json under
      # /run/containers/<uid> with "permission denied". Open up the parent
      # and give the runner user its own subdirectory.
      # See: https://discourse.nixos.org/t/building-docker-image-in-github-actions-leads-to-skopeo-related-issues/40636
      - name: Prepare writable container auth directory
        run: |
          sudo mkdir -p /run/containers
          sudo chmod 755 /run/containers
          sudo mkdir -p "/run/containers/$(id -u)"
          sudo chown "$(id -u):$(id -g)" "/run/containers/$(id -u)"

      - name: Build Docker image with Nix
        run: |
          set -e
          nix build .#dockerImage
          nix-collect-garbage -d

          if [ ! -f result ]; then
            echo "Error: Nix build did not produce result"
            exit 1
          fi
          docker load < result

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tag and push Docker image
        if: github.event_name != 'pull_request'
        run: |
          set -e

          # Get the image name from Nix build
          BUILT_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" --filter "dangling=false" | head -n 1)

          if [ -z "$BUILT_IMAGE" ]; then
            echo "Error: No Docker image found"
            exit 1
          fi

          echo "Built image: $BUILT_IMAGE"

          # Tag and push for each metadata tag
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              echo "Tagging: $tag"
              docker tag "$BUILT_IMAGE" "$tag"
              echo "Pushing: $tag"
              docker push "$tag"
            fi
          done
